name: release-android

# Tag vX.Y.Z (e.g. v1.4.0) -> signed AAB -> Play internal track (staged
# promotion to closed/production is done in Play Console after QA).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: play-release   # protected: required reviewers + secrets
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing material (never committed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi

      - name: Build signed app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build appbundle --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL=${{ vars.PROD_API_URL }}

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.puzzlehub.app
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: app/build/app/outputs/mapping/release/mapping.txt
          debugSymbols: app/build/app/intermediates/merged_native_libs/release/out/lib

      - name: Archive bundle + symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/symbols
          retention-days: 90

      - name: Clean up secrets
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks" android/app/google-services.json
