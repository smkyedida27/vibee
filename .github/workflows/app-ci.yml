name: app-ci

on:
  pull_request:
    paths: ["app/**", "content/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", "content/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Unsigned release build (smoke)
    if: github.event_name == 'push'
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      # No signing secrets here: without key.properties the build falls back to
      # debug signing. Signed bundles are produced only by release-android.yml.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-aab
          path: app/build/app/outputs/bundle/release/*.aab
          retention-days: 7
