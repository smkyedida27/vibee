name: deploy-backend

# main -> build once -> staging (auto) -> smoke -> production (manual approval
# via the protected "production" GitHub environment). The same immutable image
# digest is promoted; ECS deployment circuit breaker rolls back failed deploys.

on:
  push:
    branches: [main]
    paths: ["backend/**", "content/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
        working-directory: backend

  build-push:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/puzzlehub-staging:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Fargate tasks run on ARM64 (Graviton) - see infra/terraform/modules/ecs_service.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Render task definition
        id: td
        run: |
          aws ecs describe-task-definition --task-definition puzzlehub-staging-api \
            --query taskDefinition > taskdef.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: api
          image: ${{ needs.build-push.outputs.image }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: puzzlehub-staging
          service: api
          wait-for-service-stability: true
          wait-for-minutes: 15
      - name: Smoke test
        run: scripts/smoke-test.sh "${{ vars.STAGING_API_URL }}"
        shell: bash

  promote-image:
    needs: [build-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.copy.outputs.image }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Copy tested image to prod repository (same digest)
        id: copy
        run: |
          SRC="${{ needs.build-push.outputs.image }}"
          DST="${{ steps.ecr.outputs.registry }}/puzzlehub-prod:${GITHUB_SHA::12}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          echo "image=$DST" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: promote-image
    runs-on: ubuntu-latest
    # contents: write for the release tag created after a successful deploy.
    permissions:
      contents: write
      id-token: write
    environment:
      name: production
      url: ${{ vars.PROD_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws ecs describe-task-definition --task-definition puzzlehub-prod-api \
            --query taskDefinition > taskdef.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: api
          image: ${{ needs.promote-image.outputs.image }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: puzzlehub-prod
          service: api
          wait-for-service-stability: true
          wait-for-minutes: 20
      - name: Smoke test
        run: scripts/smoke-test.sh "${{ vars.PROD_API_URL }}"
        shell: bash
      - name: Tag release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `backend-${new Date().toISOString().slice(0,10)}-${context.sha.slice(0,7)}`;
            await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/tags/${tag}`, sha: context.sha });
