name: terraform-plan

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform-plan.yml"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  static:
    name: fmt + validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/terraform/envs/staging, infra/terraform/envs/prod, infra/terraform/bootstrap]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: ${{ matrix.dir }}

  plan:
    name: plan (${{ matrix.env }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: Write tfvars from repository variables
        env:
          TFVARS: ${{ matrix.env == 'prod' && vars.TFVARS_PROD || vars.TFVARS_STAGING }}
        run: printf '%s\n' "$TFVARS" > ci.auto.tfvars
      - name: Plan
        id: plan
        shell: bash
        run: terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/envs/${{ matrix.env }}/plan.txt', 'utf8');
            const body = `### Terraform plan — \`${{ matrix.env }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
