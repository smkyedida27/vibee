spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:puzzlehub}
    username: ${DB_USER:puzzlehub}
    password: ${DB_PASSWORD:puzzlehub}

puzzlehub:
  jwt:
    hmac-secret: ${JWT_HMAC_SECRET:dev-only-secret-change-me-0123456789abcdef}
  firebase:
    mode: ${FIREBASE_MODE:fake}
  play:
    mode: ${PLAY_MODE:fake}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
